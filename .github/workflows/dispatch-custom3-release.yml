name: Dispatch v0.2.13-custom.3 release

on:
  push:
    branches:
      - ops/tag-v0.2.13-custom.3-20261003

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             --method POST             "/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches"             -f ref="v0.2.13-custom.3"             -f 'inputs[tag]=v0.2.13-custom.3'             -f 'inputs[simple_release]=false'             -f 'inputs[dry_run]=false'
